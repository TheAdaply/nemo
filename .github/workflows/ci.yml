name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Build
        run: uv build
      - name: Lint
        run: uvx --from ruff==0.16.9 ruff check src tests
      - name: Type check
        run: uvx --from mypy==2.3.1 mypy --check-untyped-defs src/nemo_memory
      - name: Unit tests
        run: uv run --locked python -m unittest discover -s tests -p 'test_*.py' -v
      - name: CLI smoke
        run: |
          uv run --locked nemo index fixtures/synthetic/documents --db "$RUNNER_TEMP/nemo-demo.sqlite" --json
          uv run --locked nemo search 'ORBIT-742' --db "$RUNNER_TEMP/nemo-demo.sqlite" --json
          uv run --locked nemo evaluate fixtures/synthetic --json
